# Whetstone secret-scanning ruleset (ticket 0.8, spec 13.5).
#
# This file is the single source of truth for "what a secret looks like in this system", and it has
# three consumers on purpose:
#
#   1. `hooks/pre-commit`               — staged changes, before anything enters history
#   2. `.github/workflows/ci.yml` gate 7 — full history on `main`, the PR range on a pull request
#   3. Epic 2.5 candidate-text scanning  — ADR-0007 §4 requires that candidate text is scanned for
#      secrets before persistence, so a Lens that quotes a `.env` file into a `BeforeState` cannot
#      create a durable copy of a credential. That scanner points at THIS file rather than growing
#      its own patterns; two divergent definitions of "secret" is one definition too many.
#
# Once a secret is in git history, rotating it is the only real fix — cleaning history is not,
# because you do not know who cloned in between. Every rule below therefore prefers a false
# positive (cost: one `gitleaks:allow` comment) to a miss (cost: a rotation, if you notice at all).

[extend]
useDefault = true # ~180 upstream rules. The four below cover what they miss for THIS system.

# ---------------------------------------------------------------------------------------------
# 1. Corpus repository access tokens.
#
# ADR-0006 makes this system read a tenant's private source. The token configured in
# `Whetstone:Corpus:RepoAccessToken` (#7) is the credential that grants that read, which makes it
# the highest-value string in the repository and exactly the kind of thing that gets pasted into a
# test file "just to check the call works".
#
# Why this is not redundant with the upstream `github-pat` / `github-oauth` / `github-app-token` /
# `github-refresh-token` / `github-fine-grained-pat` rules: those pin an exact length (`{36}`,
# `\w{82}`) AND an entropy floor of 3. A token that is one character short because it was
# hand-retyped, a low-entropy fake somebody generated to test a code path, or a future GitHub
# format change all slip past every one of them. For a normal repo that is a sensible trade. For
# the one credential that reads a customer's private code, it is not.
# ---------------------------------------------------------------------------------------------
[[rules]]
id = "whetstone-corpus-github-token"
description = "GitHub access token — corpus repository credential (ADR-0006, Whetstone:Corpus:RepoAccessToken)"
regex = '''\b(gh[pousr]_[A-Za-z0-9]{20,255}|github_pat_[A-Za-z0-9_]{20,255})'''
keywords = [
    "ghp_",
    "gho_",
    "ghu_",
    "ghs_",
    "ghr_",
    "github_pat_",
]

# ---------------------------------------------------------------------------------------------
# 2. AI provider API keys.
#
# OQ-2 (#72) is OPEN: no provider has been chosen, and grading and generation may not resolve to
# the same one. Until it closes, this rule is deliberately a UNION of the key formats reachable
# through `Microsoft.Extensions.AI`'s `IChatClient` (§9.1) rather than the single format the
# acceptance criterion assumes.
#
# Not deleting it in the meantime is the point: "we have not picked a provider yet" is precisely
# the period when trial keys from three of them are lying around in shell history and scratch
# files. It is looser than upstream `anthropic-api-key` / `openai-api-key` / `gcp-api-key` for the
# same reason as rule 1 — those pin exact lengths and an entropy floor.
#
# When OQ-2 closes: narrow this to the chosen format(s), and say so in the ADR that closes it.
# Rules 3 and 4 stay either way — they cover a provider whose format nobody here anticipated.
# ---------------------------------------------------------------------------------------------
[[rules]]
id = "whetstone-ai-provider-api-key"
description = "AI provider API key (OQ-2 #72 open — union of candidate IChatClient provider formats)"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{20,255}|sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,255}|sk-[A-Za-z0-9]{20,255}|AIza[A-Za-z0-9_-]{20,255})'''
keywords = [
    "sk-ant-",
    "sk-proj-",
    "sk-svcacct-",
    "sk-admin-",
    "sk-",
    "aiza",
]

# ---------------------------------------------------------------------------------------------
# 3. A value in a secret-bearing configuration slot.
#
# Rules 1 and 2 match a secret by its FORMAT. This one matches it by its POSITION: the four
# secret-bearing keys of §13.5 must never carry a value anywhere in this repository, whatever that
# value looks like. That is what makes OQ-2 being open survivable — a key from a provider nobody
# anticipated still lands in `Whetstone:Ai:ApiKey`, and is still caught here.
#
# `appsettings.json` documents every one of these keys with an EMPTY value on purpose; the `{8,}`
# minimum length is what lets that stay legal without an allowlist entry.
#
# Two value forms here, and a third in rule 4:
#
#   1. QUOTED, after `:` `=` `=>` or plain whitespace — `"ApiKey": "..."`, `["Whetstone:Ai:ApiKey"]
#      = "..."`, `user-secrets set "Whetstone:Ai:ApiKey" "..."`. The quote is what makes a loose
#      separator safe: prose like "the ApiKey configuration section" has no opening quote.
#   2. UNQUOTED, but only immediately after `=` with no space either side — the environment
#      variable form, `Whetstone__Ai__ApiKey=...`, which is how production supplies these. Nothing
#      may separate the key, the `=` and the value, because that is exactly what distinguishes an
#      env assignment from C# (`options.ConnectionString = builder.Configuration.Get...`), and
#      admitting spaces here would report every such line.
#
# The `key: value` form — a YAML environment map — is rule 4, not a third branch, because it has
# to anchor to the start and end of the line and gitleaks reads the secret from the first capture
# group: one regex cannot anchor one branch without anchoring the others.
#
# No `\b` before the alternation: `\b` requires a non-word character before the keyword, and the
# double-underscore nesting means there is a `_` there — `Whetstone__Ai__ApiKey` was invisible to
# this rule for exactly that reason (PR #139 review).
# ---------------------------------------------------------------------------------------------
[[rules]]
id = "whetstone-secret-config-value"
description = "Non-empty value in a secret-bearing Whetstone configuration key (spec §13.5)"
regex = '''(?i)(?:apikey|repoaccesstoken|registryapikey|connectionstring)(?:["'\]]{0,2}\s*(?:[:=]{1,2}>?|\s)\s*["']|=)([^"'\s]{8,255})'''
keywords = [
    "apikey",
    "repoaccesstoken",
    "registryapikey",
    "connectionstring",
]

# ---------------------------------------------------------------------------------------------
# 4. The same secret-bearing slots, in line-oriented configuration syntax.
#
# Rule 3's unquoted branch demands the value sit immediately after `=`, which is exactly what keeps
# it off C# assignments — and which leaves the OTHER unquoted form uncovered. `key: value` is how a
# Compose file, a Helm values file and a Kubernetes env map all spell an environment variable:
#
#     environment:
#       Whetstone__Ai__ApiKey: pasted-provider-key
#
# and that is the snippet that gets copied into a deployment doc with a live value still in it.
#
# `key: value` is ALSO C# named-argument syntax and ordinary Markdown prose, so three structural
# discriminators do the separating. All three are load-bearing; drop any one and this rule starts
# reporting source files:
#
#   * The key starts the LINE — indentation and a `- ` list dash allowed, nothing else. Prose that
#     mentions the key mid-sentence ("the ApiKey: ...") is not a key.
#   * The value runs to the END of the line. `apiKey: configuration["Whetstone:Ai:ApiKey"],` is not
#     a value: there are quotes and a comma after it, and a YAML scalar has neither.
#   * The value may not END in `, ) ] }` or BEGIN with `# $ * & ! < >`. That removes the remaining
#     named-argument shapes (`apiKey: providerApiKey,`) and every interpolation form
#     (`${WHETSTONE_AI_KEY}`, `$CORPUS_TOKEN`) — an indirection is not a credential.
#
# Deliberately NOT path-scoped to `*.yaml`. The riskiest copy of a Compose snippet is the one
# pasted into a Markdown file to show someone how to deploy, which is the one place a path scope
# would have switched this off.
#
# Known gap, stated rather than papered over: a block scalar (`ApiKey: |`, value on the next line)
# and the Kubernetes `- name:` / `value:` pair both put the key and the secret on DIFFERENT lines.
# Catching those needs a YAML parser, not a regex. Rules 1 and 2 still see such a value if it has a
# recognisable format; if it does not, it is missed.
# ---------------------------------------------------------------------------------------------
[[rules]]
id = "whetstone-secret-config-value-line"
description = "Non-empty value on a secret-bearing Whetstone configuration key, line-oriented syntax (spec §13.5)"
regex = '''(?im)^[ \t]*(?:-[ \t]+)?["']?[A-Za-z0-9_.:$-]*(?:apikey|repoaccesstoken|registryapikey|connectionstring)["']?[ \t]*:[ \t]+([^"'\s#$*&!<>][^"'\s]{6,253}[^"'\s,)\]}])[ \t]*(?:#[^\n]*)?$'''
keywords = [
    "apikey",
    "repoaccesstoken",
    "registryapikey",
    "connectionstring",
]

# Per-value, and named to rules 3 and 4 by id — never per-path, and never blanket-global. The two
# positional rules share one definition of "obviously fake" because two copies would drift apart,
# but `targetRules` keeps it off the two FORMAT rules above: a string that opens with `test-` and
# is nonetheless a real `ghp_` token is still a finding.
#
# Not per-path because `tests/` is the single most likely place for a real token to be pasted (the
# ticket says so), so allowlisting that directory would remove the rules exactly where they earn
# their keep. These four patterns instead permit values that ANNOUNCE THEMSELVES AS FAKE — which is
# a property of the value, so it holds wherever it appears, and a real credential dropped into the
# same file is still a finding.
[[allowlists]]
targetRules = [
    "whetstone-secret-config-value",
    "whetstone-secret-config-value-line",
]
description = "Values that identify themselves as fake"
regexes = [
    # `scripts/dev-secrets.sh` seeds these into the per-user secret store. Self-describing so that
    # if one ever reaches a real API or a log, it names itself.
    '''(?i)PLACEHOLDER-whetstone-''',
    # Test doubles: `["Whetstone:Ai:ApiKey"] = "test-ai-key"` and the `Password=test-db-password`
    # inside the local connection strings in tests/*/StartupValidationTests.cs.
    '''(?i)(?:^|[=;])test-[a-z0-9-]{3,}''',
    # Documentation placeholders in angle brackets: `"<real key>"`, `"<your-token>"`.
    '''^<[^>]{1,60}>$''',
    # Local-only Postgres connection strings with no password at all — the Aspire AppHost and
    # Testcontainers both hand these out at runtime, and one occasionally lands in a doc example.
    '''(?i)^Host=(?:localhost|127\.0\.0\.1)[^"']*$''',
]
